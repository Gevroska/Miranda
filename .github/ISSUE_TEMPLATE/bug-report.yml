---
name: Bug report
description: Report reproducible Miranda behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Include only the information needed to reproduce the issue.
        Do not attach credentials, pairing state or complete private configuration files.
        Use a private reporting channel for security vulnerabilities when available.
  - type: input
    id: version
    attributes:
      label: Miranda version or commit
      description: Identify the actual package or source revision.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Host OS, GPU/driver, virtual display driver, client/OS and requested mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal sanitized evidence
      description: Include a relevant excerpt and note any recovery or workaround.
