---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

name: CodeQL
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '00 12 * * 0'  # every Sunday at 12:00 UTC

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  call-codeql:
    name: CodeQL
    uses: LizardByte/.github/.github/workflows/__call-codeql.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: ${{ github.repository != 'LizardByte/.github' }}
    permissions:
      actions: read
      contents: read
      security-events: write
