---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

name: common lint
permissions: {}

on:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Common Lint
    uses: LizardByte/.github/.github/workflows/__call-common-lint.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: ${{ github.repository != 'LizardByte/.github' }}
    permissions:
      contents: read
      pull-requests: read
