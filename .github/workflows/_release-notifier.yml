---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

# Create a blog post for a new release and open a PR to the blog repo

name: Release Notifications
permissions: {}

on:
  release:
    types:
      - released  # this triggers when a release is published, but does not include pre-releases or drafts

jobs:
  update-blog:
    name: Update blog
    uses: LizardByte/.github/.github/workflows/__call-release-notifier.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: github.repository == 'LizardByte/Sunshine'
    permissions:
      contents: read
    with:
      gh_name: ${{ vars.GH_BOT_NAME }}
    secrets:
      GH_EMAIL: ${{ secrets.GH_BOT_EMAIL }}
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
