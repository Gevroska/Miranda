---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

# Create a top issues dashboard

name: Top issues
permissions: {}

on:
  schedule:
    - cron: '0 6/12 * * *'
  workflow_dispatch:

concurrency:
  group: 'top-issues'
  cancel-in-progress: true

jobs:
  top-issues:
    name: Top issues
    uses: LizardByte/.github/.github/workflows/__call-top-issues.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: github.repository == 'LizardByte/Sunshine'
    permissions:
      contents: read
      issues: write
