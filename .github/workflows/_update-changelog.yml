---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

name: Update changelog
permissions: {}

on:
  release:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  update-changelog:
    name: Update Changelog
    uses: LizardByte/.github/.github/workflows/__call-update-changelog.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: >-
      github.repository == 'LizardByte/Sunshine' &&
      (github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease && !github.event.release.draft))
    permissions:
      contents: read
    secrets:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
