---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

# To use, add the `rtd` repository label to identify repositories that should trigger this workflow.
# If the project slug is not the repository name, add a repository variable named `READTHEDOCS_SLUG` with the value of
# the ReadTheDocs project slug.

# Update readthedocs on release events.

name: Update docs
permissions: {}

on:
  release:
    types:
      - created
      - edited
      - deleted

concurrency:
  group: "${{ github.workflow }}-${{ github.event.release.tag_name }}"
  cancel-in-progress: true

jobs:
  update-docs:
    name: Update docs
    uses: LizardByte/.github/.github/workflows/__call-update-docs.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: github.repository == 'LizardByte/Sunshine'
    permissions: {}
    with:
      readthedocs_slug: ${{ vars.READTHEDOCS_SLUG }}
    secrets:
      READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
