---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

# To use, add the `pacman-pkg` repository label to identify repositories that should trigger this workflow.

# Update pacman repo on release events.

name: Update pacman repo
permissions: {}

on:
  release:
    types:
      - released

concurrency:
  group: "${{ github.workflow }}-${{ github.event.release.tag_name }}"
  cancel-in-progress: true

jobs:
  update-pacman-repo:
    name: Update pacman repo
    uses: LizardByte/.github/.github/workflows/__call-update-pacman-repo.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: github.repository == 'LizardByte/Sunshine'
    permissions:
      contents: read
    with:
      gh_name: ${{ vars.GH_BOT_NAME }}
    secrets:
      GH_EMAIL: ${{ secrets.GH_BOT_EMAIL }}
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
