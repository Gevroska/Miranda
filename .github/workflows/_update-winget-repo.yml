---
# Inherited from LizardByte/.github; maintained locally for Miranda.
# Upstream publication integrations remain restricted to their original repository.

# To use, add the `winget-pkg` repository label to identify repositories that should trigger this workflow.

# Update Winget on release events.

name: Update Winget repo
permissions: {}

on:
  release:
    types:
      - released

concurrency:
  group: "${{ github.workflow }}-${{ github.event.release.tag_name }}"
  cancel-in-progress: true

jobs:
  update-winget-repo:
    name: Update Winget repo
    uses: LizardByte/.github/.github/workflows/__call-update-winget-repo.yml@e5b768985d9c5addc082bda9a1274ab064cbf0d9
    if: github.repository == 'LizardByte/Sunshine'
    permissions:
      contents: read
    secrets:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
