---
name: CI-Windows
permissions: {}

on:
  workflow_call:
    inputs:
      # Azure Artifact Signing account name
      azure_signing_account:
        required: false
        type: string
        default: ''
      # Azure Artifact Signing certificate profile name
      azure_signing_cert_profile:
        required: false
        type: string
        default: ''
      # Azure Artifact Signing account endpoint
      # e.g. https://<region>.codesigning.azure.net
      azure_signing_endpoint:
        required: false
        type: string
        default: ''
      publish_release:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      release_version:
        required: true
        type: string
    secrets:
      # Azure Client ID (App Registration) for Artifact Signing
      AZURE_CLIENT_ID:
        required: false
      # Azure Client Secret for Artifact Signing
      AZURE_CLIENT_SECRET:
        required: false
      # Azure Tenant ID for Artifact Signing
      AZURE_TENANT_ID:
        required: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  build_windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-AMD64
            os: windows-2022
            arch: x86_64
            msystem: ucrt64
            toolchain: ucrt-x86_64
          - name: Windows-ARM64
            os: windows-11-arm
            arch: aarch64
            msystem: clangarm64
            toolchain: clang-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Dependencies Windows
        id: setup-msys2
        # if a dependency needs to be pinned, see https://github.com/LizardByte/build-deps/pull/186
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            wget

      - name: Prefer MSYS2 primary package server
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
        run: |
          # The first server is preferred; keep the remaining mirrors as fallbacks.
          # https://www.msys2.org/dev/mirrors/
          $ErrorActionPreference = "Stop"
          $origins = @{
            "mirrorlist.mingw" = 'Server = https://repo.msys2.org/mingw/$repo/'
            "mirrorlist.msys" = 'Server = https://repo.msys2.org/msys/$arch/'
          }
          foreach ($entry in $origins.GetEnumerator()) {
            $mirrorlist = Join-Path $env:MSYS2_LOCATION "etc/pacman.d/$($entry.Key)"
            $fallbacks = @([System.IO.File]::ReadAllLines($mirrorlist) | Where-Object { $_ -cne $entry.Value })
            $servers = @($entry.Value) + $fallbacks
            [System.IO.File]::WriteAllText($mirrorlist, ($servers -join "`n") + "`n")
          }

      - name: Update Windows dependencies
        env:
          # MSYSTEM is a built-in environment variable of MSYS2.
          # Do not use this environment variable name.
          MATRIX_MSYSTEM: ${{ matrix.msystem }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        shell: msys2 {0}
        run: |
          # variables
          declare -A pinned_deps

          # dependencies
          dependencies=(
            "git"
            "mingw-w64-${TOOLCHAIN}-boost"
            "mingw-w64-${TOOLCHAIN}-cmake"
            "mingw-w64-${TOOLCHAIN}-cppwinrt"
            "mingw-w64-${TOOLCHAIN}-curl-winssl"
            "mingw-w64-${TOOLCHAIN}-doxygen"
            "mingw-w64-${TOOLCHAIN}-gcc"
            "mingw-w64-${TOOLCHAIN}-graphviz"
            "mingw-w64-${TOOLCHAIN}-miniupnpc"
            "mingw-w64-${TOOLCHAIN}-nlohmann-json"
            "mingw-w64-${TOOLCHAIN}-onevpl"
            "mingw-w64-${TOOLCHAIN}-openssl"
            "mingw-w64-${TOOLCHAIN}-opus"
            "mingw-w64-${TOOLCHAIN}-toolchain"
            "mingw-w64-${TOOLCHAIN}-qt6-static"
          )

          if [[ "${MATRIX_MSYSTEM}" == "ucrt64" ]]; then
            dependencies+=(
              "mingw-w64-${TOOLCHAIN}-MinHook"
              "mingw-w64-${TOOLCHAIN}-nsis"
            )
          fi

          # do not modify below this line

          ignore_packages=()
          tarballs=""
          for pkg in "${!pinned_deps[@]}"; do
            ignore_packages+=("${pkg}")
            version="${pinned_deps[$pkg]}"
            tarball="${pkg}-${version}-any.pkg.tar.zst"

            # download working version
            wget --max-redirect=0 "https://repo.msys2.org/mingw/${MATRIX_MSYSTEM}/${tarball}"

            tarballs="${tarballs} ${tarball}"
          done

          # Create the ignore string for pacman
          ignore_list=$(IFS=,; echo "${ignore_packages[*]}")

          # install pinned dependencies
          if [ -n "${tarballs}" ]; then
            pacman -U --noconfirm "${tarballs}"
          fi

          # Only add --ignore if we have packages to ignore
          if [ -n "${ignore_list}" ]; then
            pacman -Syu --noconfirm --ignore="${ignore_list}" "${dependencies[@]}"
          else
            pacman -Syu --noconfirm "${dependencies[@]}"
          fi

      - name: Setup dotnet  # needed for wix
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 'lts/*'

      - name: NodeJS Path
        shell: pwsh
        run: |
          # get NodeJS PATH
          $NODEJS_BINARY_PATH = (Get-Command node).Source
          $NODEJS_PATH = Split-Path -Path "$NODEJS_BINARY_PATH" -Parent

          # setup environment variables
          echo "NODEJS_PATH=$NODEJS_PATH" >> $env:GITHUB_ENV

          # step output
          echo "nodejs-path=$NODEJS_PATH"
          echo "nodejs-path=$NODEJS_PATH" >> $env:GITHUB_OUTPUT

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Sync Python tools
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          uv_sync_args=(
            --locked
            --no-python-downloads
            --no-install-project
          )
          # uv.lock pins external artifacts; the reviewed local lizardbyte-common build hook is required.
          uv sync "${uv_sync_args[@]}"  # NOSONAR(githubactions:S8541, githubactions:S8544)

      - name: Build Windows
        shell: msys2 {0}
        env:
          # MSYSTEM is a built-in environment variable of MSYS2.
          # Do not use this environment variable name.
          MATRIX_MSYSTEM: ${{ matrix.msystem }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ inputs.release_version }}
          COMMIT: ${{ inputs.release_commit }}
        run: |
          # setup NodeJS PATH
          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"

          mkdir -p cmake-build-ci
          cmake \
            -B cmake-build-ci \
            -G Ninja \
            -S . \
            -DBUILD_WERROR=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://app.lizardbyte.dev" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://app.lizardbyte.dev/support"
          echo "::add-matcher::.github/matchers/gcc.json"
          ninja -C cmake-build-ci
          echo "::remove-matcher owner=gcc::"

      - name: Check Windows linkage
        shell: msys2 {0}
        run: |
          set -euo pipefail

          binaries=(
            cmake-build-ci/sunshine.exe
            cmake-build-ci/tools/audio-info.exe
            cmake-build-ci/tools/dxgi-info.exe
            cmake-build-ci/tools/sunshinesvc.exe
            cmake-build-ci/tests/test_sunshine.exe
          )

          unexpected_deps=""
          for binary in "${binaries[@]}"; do
            echo "::group::ldd ${binary}"
            if ! linkage="$(ldd "${binary}")"; then
              echo "${linkage}"
              exit 1
            fi
            echo "${linkage}"
            echo "::endgroup::"

            unexpected_for_binary="$(awk '
              BEGIN { IGNORECASE = 1 }
              $1 == "zlib1.dll" { next }
              $1 ~ /^minhook-detours\..*\.dll$/ { next }
              $1 ~ /^api-ms-win-/ { next }
              $1 ~ /^ext-ms-win-/ { next }
              $0 ~ /=>[[:space:]]+not found/ { print }
              $0 ~ /=>[[:space:]]+\/(clangarm64|clang64|mingw32|mingw64|ucrt64)\/bin\// { print }
            ' <<< "${linkage}")"

            if [[ -n "${unexpected_for_binary}" ]]; then
              unexpected_deps="${unexpected_deps}"$'\n'"${binary}:"$'\n'"${unexpected_for_binary}"
            fi
          done

          if [[ -n "${unexpected_deps}" ]]; then
            echo "Unexpected non-packaged runtime dependencies were found:"
            echo "${unexpected_deps}"
            exit 1
          fi

      - name: Sign Windows executables
        # ARM64 is not currently supported, see https://github.com/Azure/artifact-signing-action/issues/92
        if: >-
          github.repository == 'LizardByte/Sunshine' &&
          inputs.publish_release == 'true' &&
          inputs.azure_signing_account != '' &&
          matrix.name != 'Windows-ARM64'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          certificate-profile-name: ${{ inputs.azure_signing_cert_profile }}
          endpoint: ${{ inputs.azure_signing_endpoint }}
          files: |
            ${{ github.workspace }}/cmake-build-ci/sunshine.exe
            ${{ github.workspace }}/cmake-build-ci/tools/audio-info.exe
            ${{ github.workspace }}/cmake-build-ci/tools/dxgi-info.exe
            ${{ github.workspace }}/cmake-build-ci/tools/sunshinesvc.exe
          files-folder: src_assets/windows
          files-folder-filter: ps1
          files-folder-recurse: true
          signing-account-name: ${{ inputs.azure_signing_account }}

      - name: Package Windows
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          cd cmake-build-ci

          # package
          cpack -G WIX
          cpack -G ZIP

          # move
          mv ./cpack_artifacts/Sunshine.msi ../artifacts/Sunshine-${{ matrix.name }}-installer.msi
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/Sunshine-${{ matrix.name }}-lite.zip

      - name: Sign Windows installers
        # ARM64 is not currently supported, see https://github.com/Azure/artifact-signing-action/issues/92
        if: >-
          github.repository == 'LizardByte/Sunshine' &&
          inputs.publish_release == 'true' &&
          inputs.azure_signing_account != '' &&
          matrix.name != 'Windows-ARM64'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          certificate-profile-name: ${{ inputs.azure_signing_cert_profile }}
          endpoint: ${{ inputs.azure_signing_endpoint }}
          files-folder: artifacts
          files-folder-filter: msi
          files-folder-recurse: false
          signing-account-name: ${{ inputs.azure_signing_account }}

      - name: Debug wix
        if: always()
        shell: msys2 {0}
        run: cat ./cmake-build-ci/cpack_artifacts/_CPack_Packages/win64/WIX/wix.log || true

      - name: Initialize tray icon
        working-directory: cmake-build-ci/tests
        env:
          SUNSHINE_CONFIGURE_TRAY_ICONS: '1'
        run: >-
          ./test_sunshine.exe
          --gtest_color=yes
          --gtest_filter=SystemTrayTest.InitializesTrayForWorkflowConfiguration

      - name: Configure Windows tray screenshots
        # yamllint disable-line rule:line-length
        uses: LizardByte/tray/.github/actions/configure-windows-tray-screenshots@8d49be1f9ea1a5cb40668e8651cf02300abd4b49

      - name: Run tests
        id: test
        # Keep child-process tests in a native Windows context after the MSYS2 build.
        shell: pwsh
        working-directory: cmake-build-ci/tests
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
          MATRIX_MSYSTEM: ${{ matrix.msystem }}
        run: |
          $runtimeBin = Join-Path $env:MSYS2_LOCATION "$env:MATRIX_MSYSTEM/bin"
          if (-not (Test-Path -LiteralPath $runtimeBin -PathType Container)) {
            throw 'Configured MSYS2 runtime directory is unavailable'
          }
          $env:PATH = "$runtimeBin;$env:PATH"
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/scripts/windows-process-creation-diagnostic.ps1')
          & ./test_sunshine.exe --gtest_color=yes --gtest_output=xml:test_results.xml
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload system tray screenshots
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sunshine-screenshots-${{ matrix.name }}
          path: cmake-build-ci/tests/screenshots
          if-no-files-found: error

      - name: Generate gcov report
        id: test_report
        # any except canceled or skipped
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        shell: msys2 {0}
        working-directory: cmake-build-ci
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          uv run --project .. --locked --no-build --no-sync gcovr . -r ../src \
            --exclude-noncode-lines \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --verbose \
            --xml-pretty \
            -o coverage.xml

      - name: Upload coverage artifact
        if: >-
          always() &&
          (steps.test_report.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.name }}
          path: |
            cmake-build-ci/coverage.xml
            cmake-build-ci/tests/test_results.xml
          if-no-files-found: error

      - name: Package Windows Debug Info
        shell: pwsh
        working-directory: cmake-build-ci
        run: |
          # use .dbg file extension for binaries to avoid confusion with real packages
          Get-ChildItem -File -Recurse | `
            % { Rename-Item -Path $_.PSPath -NewName $_.Name.Replace(".exe",".dbg") }

          # save the binaries with debug info
          7z -r `
            "-xr!CMakeFiles" `
            "-xr!cpack_artifacts" `
            a "../artifacts/Sunshine-${{ matrix.name }}-debuginfo.7z" "*.dbg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
