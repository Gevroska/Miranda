---
name: CI
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# P0 validates inherited builds only. Package branding, signing and publication
# require a separately reviewed Miranda release workflow.
jobs:
  build-metadata:
    name: Validation metadata
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.metadata.outputs.release_commit }}
      release_version: ${{ steps.metadata.outputs.release_version }}
    steps:
      - name: Set validation version
        id: metadata
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          echo "release_commit=${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "release_version=0.0.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

  build-docker:
    name: Docker
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-docker.yml
    with:
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-freebsd:
    name: FreeBSD
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-freebsd.yml
    with:
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-homebrew:
    name: Homebrew
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-homebrew.yml
    with:
      publish_release: ${{ 'false' }}
      git_username: github-actions[bot]
      release_tag: ''
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-macos:
    name: macOS
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      publish_release: ${{ 'false' }}
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-linux:
    name: Linux
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-linux.yml
    with:
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-archlinux:
    name: Archlinux
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-archlinux.yml
    with:
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-alpine:
    name: Alpine
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-alpine.yml
    with:
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-linux-flatpak:
    name: Linux Flatpak
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-flatpak.yml
    with:
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  build-windows:
    name: Windows
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: ${{ 'false' }}
      release_commit: ${{ needs.build-metadata.outputs.release_commit }}
      release_version: ${{ needs.build-metadata.outputs.release_version }}

  test-powershell:
    name: PowerShell
    permissions:
      contents: read
    uses: ./.github/workflows/ci-powershell.yml

  web-ui:
    name: Web UI
    needs: build-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci-web.yml
    with:
      release_version: ${{ needs.build-metadata.outputs.release_version }}
