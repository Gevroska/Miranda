---
name: localize
permissions: {}

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/localize.yml'
      - 'src/**'
      - 'locale/sunshine.po'
  workflow_dispatch:

jobs:
  localize:
    # P0: upstream integration is inactive in Miranda until its destination is reviewed.
    if: github.repository == 'LizardByte/Sunshine'
    name: Update Localization
    permissions:
      contents: read
    uses: LizardByte/lizardbyte-common/.github/workflows/localize.yml@cdc291c8e844741365582262f5d64b5378d75134
    secrets:
      GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
